    id: slave2_charging_mos
    entity_category: diagnostic
  - platform: template
    name: "Slave 2 Discharging MOS"
    id: slave2_discharging_mos
    entity_category: diagnostic
  - platform: template
    name: "Slave 2 Heating MOS"
    id: slave2_heating_mos
    entity_category: diagnostic
  - platform: template
    name: "Slave 2 Software Version"
    id: slave2_software_version
    entity_category: diagnostic
  - platform: template
    name: "Slave 2 Secondary Alarms Mask"
    id: slave2_secondary_alarms
    entity_category: diagnostic
    
  - platform: template
