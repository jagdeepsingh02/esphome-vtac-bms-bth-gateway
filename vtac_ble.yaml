  # Diagnostics
  - platform: template
    name: "Master Instantaneous Power"
    id: master_power
    unit_of_measurement: "W"
    accuracy_decimals: 1
    device_class: power
    lambda: 'return id(master_voltage).state * id(master_current).state;'
  - platform: template
    name: "Master Cycle Count"
    id: master_cycle_count
    unit_of_measurement: "Cycles"
    accuracy_decimals: 1
    lambda: |-
      if (id(master_capacity).state > 0) {
        return id(master_discharge_capacity_ah).state / id(master_capacity).state;
      }
      return 0;
  - platform: template
    name: "Master Time to Full/Empty"
    id: master_time_remaining
    unit_of_measurement: "h"
    accuracy_decimals: 1
    lambda: |-
      float current = id(master_current).state;
      if (current == 0) return 0;
      if (current < 0) {
        return id(master_remaining_capacity).state / (-current);
      } else {
        return (id(master_capacity).state - id(master_remaining_capacity).state) / current;
      }
  - platform: template
    name: "Master Cell Imbalance"
    id: master_cell_imbalance
    unit_of_measurement: "mV"
    accuracy_decimals: 0
    lambda: 'return (id(master_max_cell_v).state - id(master_min_cell_v).state) * 1000.0;'
    
  - platform: template
    name: "Slave 1 Instantaneous Power"
