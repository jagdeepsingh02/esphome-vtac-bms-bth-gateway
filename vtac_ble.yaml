esphome:
  name: vtac_batteries_bth_gateway
  friendly_name: VTAC Batteries Bluetooth Gateway
  
esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true
      minimum_chip_revision: "3.0"

# Keep verbose logging so we can see the Service Discovery!
logger:
  level: DEBUG

globals:
  - id: energy_poll_timer
    type: uint32_t
    initial_value: '43140'
  - id: last_successful_response_time
    type: uint32_t
    initial_value: '0'
  - id: fast_poll_timer
    type: float
    initial_value: '0'
  - id: slow_poll_timer
    type: float
    initial_value: '0'
  - id: current_batt_id
    type: int
    initial_value: '1'
  - id: fast_script_start_time
    type: uint32_t
    initial_value: '0'
  - id: slow_script_start_time
    type: uint32_t
    initial_value: '0'
  - id: fast_actual_execution_time
    type: float
    initial_value: '0'
  - id: slow_actual_execution_time
    type: float
    initial_value: '0'
  - id: current_cycle_max_time
    type: uint32_t
    initial_value: '0'
  - id: current_cycle_max_job
    type: std::string
    initial_value: '""'
  - id: current_job_start
    type: uint32_t
    initial_value: '0'
  - id: current_job_name
    type: std::string
    initial_value: '""'
  - id: response_received
    type: bool
    initial_value: 'false'

number:
  - platform: template
    name: "Fast Polling Interval"
    id: fast_poll_interval
    min_value: 0.1
    max_value: 60.0
    step: 0.1
    initial_value: 5
    unit_of_measurement: "s"
    mode: box
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    name: "Slow Polling Interval"
    id: slow_poll_interval
    min_value: 10
    max_value: 3600
    step: 5
    initial_value: 60
    unit_of_measurement: "s"
    mode: box
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    name: "Slave Count"
    id: slave_count
    min_value: 0
    max_value: 2
    step: 1
    initial_value: 2
    unit_of_measurement: "Slaves"
    mode: box
    optimistic: true
    restore_value: true
    entity_category: config
    
  - platform: template
    name: "Energy Poll Interval"
    id: energy_poll_interval
    min_value: 1
    max_value: 24
    step: 1
    initial_value: 12
    optimistic: true
    restore_value: true
    entity_category: config
    unit_of_measurement: "h"
  - platform: template
    name: "Watchdog Timeout"
    id: watchdog_timeout
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 15
    optimistic: true
    restore_value: true
    entity_category: config
    unit_of_measurement: "min"

web_server:
  port: 80
  
api:
  max_connections: 1
  encryption:
    key: !secret vtac_batteries_bth_gateway__encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: !secret emgy_AP
    password: !secret emgy_AP_Password

captive_portal:

binary_sensor:
  - platform: template
    name: "Master Battery Connected"
    id: battery_connected
    entity_category: diagnostic

# --- THE MAGIC SAUCE ---
esp32_ble_tracker:

# Remove includes from top of file if you put them there

ble_client:
  - mac_address: !secret vtac_batteries_bth_gateway__MasterBatteryMAC
    id: ble
# We write directly to the BLE characteristic to ask for data!
    on_connect:
      then:
        - lambda: 'id(last_successful_response_time) = millis();'
        - logger.log: "Connected! Battery will likely spam 0D config first..."
        - binary_sensor.template.publish:
            id: battery_connected
            state: ON
    on_disconnect:
      then:
        - logger.log: "Disconnected from Battery!"
        - script.stop: execute_fast_jobs
        - script.stop: execute_slow_jobs
        - script.stop: execute_energy_jobs
        - binary_sensor.template.publish:
            id: battery_connected
            state: OFF


button:
  - platform: restart
    name: "Restart Gateway"
    id: restart_gateway
    entity_category: config
  - platform: template
    name: "Force Poll Energy"
    id: force_poll_energy
    entity_category: diagnostic
    icon: "mdi:battery-sync"
    on_press:
      - lambda: |-
          if (id(battery_connected).state) {
            id(energy_poll_timer) = (id(energy_poll_interval).state * 3600);
            ESP_LOGI("main", "Energy poll forced by user.");
          } else {
            ESP_LOGW("main", "Cannot force energy poll, battery is not connected.");
          }

script:

  - id: execute_fast_jobs
    mode: single
    then:
      - lambda: |-
          id(fast_script_start_time) = millis();
          id(current_batt_id) = 1;
          id(current_cycle_max_time) = 0;
          id(current_cycle_max_job) = "";
      - logger.log: "Polling System Telemetry (Command 1)..."
      - lambda: |-
          id(response_received) = false;
          id(current_job_start) = millis();
          id(current_job_name) = "System Telemetry (Command 1)";
      - ble_client.ble_write:
          id: ble
          service_uuid: '6E400001-B5A3-F393-E0A9-E50E24DCCA9E'
          characteristic_uuid: '6E400002-B5A3-F393-E0A9-E50E24DCCA9E'
          value: [0xAB, 0xAB, 0x01, 0x00, 0x00, 0x00, 0x00, 0x1, 0x00, 0x0F, 0x00, 0x01, 0x00, 0x0D, 0x0A]
      - wait_until:
          condition:
            lambda: 'return id(response_received);'
          timeout: 1.5s
      - delay: 50ms
      - lambda: |-
          uint32_t duration = millis() - id(current_job_start);
          if (duration > id(current_cycle_max_time)) {
            id(current_cycle_max_time) = duration;
            char buf[100];
            sprintf(buf, "%s - %dms", id(current_job_name).c_str(), duration);
            id(current_cycle_max_job) = buf;
          }
      - while:
          condition:
            lambda: 'return id(current_batt_id) <= (id(slave_count).state + 1);'
          then:
            - logger.log:
                format: "Polling Battery (ID %d) for Telemetry (Command 2)..."
                args: [ 'id(current_batt_id)' ]
            - lambda: |-
                id(response_received) = false;
                id(current_job_start) = millis();
                id(current_job_name) = "Telemetry (Command 2)";
            - ble_client.ble_write:
                id: ble
                service_uuid: '6E400001-B5A3-F393-E0A9-E50E24DCCA9E'
                characteristic_uuid: '6E400002-B5A3-F393-E0A9-E50E24DCCA9E'
                value: !lambda |-
                  return {0xAB, 0xAB, (uint8_t)id(current_batt_id), 0x00, 0x00, 0x00, 0x00, 0x02, 0x00, 0x0F, 0x00, 0x01, 0x00, 0x0D, 0x0A};
            - wait_until:
                condition:
                  lambda: 'return id(response_received);'
                timeout: 1.5s
            - delay: 50ms
            - lambda: |-
                uint32_t duration = millis() - id(current_job_start);
                if (duration > id(current_cycle_max_time)) {
                  id(current_cycle_max_time) = duration;
                  char buf[100];
                  sprintf(buf, "%s (Batt %d) - %dms", id(current_job_name).c_str(), id(current_batt_id), duration);
                  id(current_cycle_max_job) = buf;
                }
            
            - logger.log:
                format: "Polling Battery (ID %d) for Cell Voltages (Command 3)..."
                args: [ 'id(current_batt_id)' ]
            - lambda: |-
                id(response_received) = false;
                id(current_job_start) = millis();
                id(current_job_name) = "Cell Voltages (Command 3)";
            - ble_client.ble_write:
                id: ble
                service_uuid: '6E400001-B5A3-F393-E0A9-E50E24DCCA9E'
                characteristic_uuid: '6E400002-B5A3-F393-E0A9-E50E24DCCA9E'
                value: !lambda |-
                  return {0xAB, 0xAB, (uint8_t)id(current_batt_id), 0x00, 0x00, 0x00, 0x00, 0x03, 0x00, 0x0F, 0x00, 0x01, 0x00, 0x0D, 0x0A};
            - wait_until:
                condition:
                  lambda: 'return id(response_received);'
                timeout: 1.5s
            - delay: 50ms
            - lambda: |-
                uint32_t duration = millis() - id(current_job_start);
                if (duration > id(current_cycle_max_time)) {
                  id(current_cycle_max_time) = duration;
                  char buf[100];
                  sprintf(buf, "%s (Batt %d) - %dms", id(current_job_name).c_str(), id(current_batt_id), duration);
                  id(current_cycle_max_job) = buf;
                }
            
            - lambda: 'id(current_batt_id) += 1;'
            
      - lambda: |-
          id(longest_response_time).publish_state(id(current_cycle_max_time));
          id(longest_response_job).publish_state(id(current_cycle_max_job));
          id(fast_actual_execution_time) = (millis() - id(fast_script_start_time)) / 1000.0;

  - id: execute_slow_jobs
    mode: single
    then:
      - lambda: |-
          id(slow_script_start_time) = millis();
          id(current_batt_id) = 1;
          id(current_cycle_max_time) = 0;
          id(current_cycle_max_job) = "";
      - while:
          condition:
            lambda: 'return id(current_batt_id) <= (id(slave_count).state + 1);'
          then:
            - logger.log:
                format: "Polling Battery (ID %d) for Temperatures (Command 4)..."
                args: [ 'id(current_batt_id)' ]
            - lambda: |-
                id(response_received) = false;
                id(current_job_start) = millis();
                id(current_job_name) = "Temperatures (Command 4)";
            - ble_client.ble_write:
                id: ble
                service_uuid: '6E400001-B5A3-F393-E0A9-E50E24DCCA9E'
                characteristic_uuid: '6E400002-B5A3-F393-E0A9-E50E24DCCA9E'
                value: !lambda |-
                  return {0xAB, 0xAB, (uint8_t)id(current_batt_id), 0x00, 0x00, 0x00, 0x00, 0x04, 0x00, 0x0F, 0x00, 0x01, 0x00, 0x0D, 0x0A};
            - wait_until:
                condition:
                  lambda: 'return id(response_received);'
                timeout: 1.5s
            - delay: 50ms
            - lambda: |-
                uint32_t duration = millis() - id(current_job_start);
                if (duration > id(current_cycle_max_time)) {
                  id(current_cycle_max_time) = duration;
                  char buf[100];
                  sprintf(buf, "%s (Batt %d) - %dms", id(current_job_name).c_str(), id(current_batt_id), duration);
                  id(current_cycle_max_job) = buf;
                }
            
            
            - lambda: 'id(current_batt_id) += 1;'
            
      - logger.log: "Polling System General View (Command 01)..."
      - lambda: |-
          id(response_received) = false;
          id(current_job_start) = millis();
          id(current_job_name) = "System General View (Command 01)";
      - ble_client.ble_write:
          id: ble
          service_uuid: '6E400001-B5A3-F393-E0A9-E50E24DCCA9E'
          characteristic_uuid: '6E400002-B5A3-F393-E0A9-E50E24DCCA9E'
          value: [0xAB, 0xAB, 0x00, 0x00, 0x00, 0x00, 0x00, 0x01, 0x00, 0x14, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x01, 0x00, 0x0D, 0x0A]
      - wait_until:
          condition:
            lambda: 'return id(response_received);'
          timeout: 1.5s
      - delay: 50ms
      - lambda: |-
          uint32_t duration = millis() - id(current_job_start);
          if (duration > id(current_cycle_max_time)) {
            id(current_cycle_max_time) = duration;
            char buf[100];
            sprintf(buf, "%s - %dms", id(current_job_name).c_str(), duration);
            id(current_cycle_max_job) = buf;
          }

      - lambda: |-
          id(longest_response_time).publish_state(id(current_cycle_max_time));
          id(longest_response_job).publish_state(id(current_cycle_max_job));
          id(slow_actual_execution_time) = (millis() - id(slow_script_start_time)) / 1000.0;

  - id: execute_energy_jobs
    mode: single
    then:
      - lambda: |-
          id(current_batt_id) = 1;
          id(current_cycle_max_time) = 0;
          id(current_cycle_max_job) = "";
      - while:
          condition:
            lambda: 'return id(current_batt_id) <= (id(slave_count).state + 1);'
          then:
            - logger.log:
                format: "Polling Battery (ID %d) for Charge Energy (Command 9)..."
                args: [ 'id(current_batt_id)' ]
            - lambda: |-
                id(response_received) = false;
                id(current_job_start) = millis();
                id(current_job_name) = "Charge Energy (Command 9)";
            - ble_client.ble_write:
                id: ble
                service_uuid: '6E400001-B5A3-F393-E0A9-E50E24DCCA9E'
                characteristic_uuid: '6E400002-B5A3-F393-E0A9-E50E24DCCA9E'
                value: !lambda |-
                  return {0xAB, 0xAB, (uint8_t)id(current_batt_id), 0x00, 0x00, 0x00, 0x00, 0x09, 0x00, 0x15, 0x53, 0x43, 0x52, 0x00, 0x00, 0x00, 0x00, 0x01, 0x00, 0x0D, 0x0A};
            - wait_until:
                condition:
                  lambda: 'return id(response_received);'
                timeout: 1.5s
            - delay: 50ms
            - lambda: |-
                uint32_t duration = millis() - id(current_job_start);
                if (duration > id(current_cycle_max_time)) {
                  id(current_cycle_max_time) = duration;
                  char buf[100];
                  sprintf(buf, "%s (Batt %d) - %dms", id(current_job_name).c_str(), id(current_batt_id), duration);
                  id(current_cycle_max_job) = buf;
                }
            
            - logger.log:
                format: "Polling Battery (ID %d) for Discharge Energy (Command 0A)..."
                args: [ 'id(current_batt_id)' ]
            - lambda: |-
                id(response_received) = false;
                id(current_job_start) = millis();
                id(current_job_name) = "Discharge Energy (Command 0A)";
            - ble_client.ble_write:
                id: ble
                service_uuid: '6E400001-B5A3-F393-E0A9-E50E24DCCA9E'
                characteristic_uuid: '6E400002-B5A3-F393-E0A9-E50E24DCCA9E'
                value: !lambda |-
                  return {0xAB, 0xAB, (uint8_t)id(current_batt_id), 0x00, 0x00, 0x00, 0x00, 0x0A, 0x00, 0x15, 0x53, 0x43, 0x52, 0x00, 0x00, 0x00, 0x00, 0x01, 0x00, 0x0D, 0x0A};
            - wait_until:
                condition:
                  lambda: 'return id(response_received);'
                timeout: 1.5s
            - delay: 50ms
            - lambda: |-
                uint32_t duration = millis() - id(current_job_start);
                if (duration > id(current_cycle_max_time)) {
                  id(current_cycle_max_time) = duration;
                  char buf[100];
                  sprintf(buf, "%s (Batt %d) - %dms", id(current_job_name).c_str(), id(current_batt_id), duration);
                  id(current_cycle_max_job) = buf;
                }
            
            - lambda: 'id(current_batt_id) += 1;'
            
      - lambda: |-
          id(longest_response_time).publish_state(id(current_cycle_max_time));
          id(longest_response_job).publish_state(id(current_cycle_max_job));

interval:
  # Force a deeper disconnect every 60 minutes to prevent the PACE BMS Bluetooth stack from locking up
  # We stop the scanner to ensure it stays disconnected for exactly 5 seconds to let the battery breathe
  - interval: 60min
    then:
      - if:
          condition:
            lambda: 'return id(ble).connected();'
          then:
            - logger.log: "Initiating 5-second BLE breather to clear BMS buffer..."
            - esp32_ble_tracker.stop_scan:
            - ble_client.disconnect: ble
            - delay: 5s
            - esp32_ble_tracker.start_scan:

  - interval: 1s
    then:
      - lambda: |-
          // Watchdog check
          if (id(battery_connected).state) {
            uint32_t elapsed = millis() - id(last_successful_response_time);
            uint32_t timeout_ms = (uint32_t)(id(watchdog_timeout).state * 60000.0);
            if (elapsed > timeout_ms) {
              ESP_LOGE("main", "Watchdog triggered! No valid response in %d minutes. Restarting...", (int)id(watchdog_timeout).state);
              id(restart_gateway).press();
            }
          }
          
          // If any script is still running over the air, do nothing and don't count up yet!
          if (id(execute_fast_jobs).is_running() || id(execute_slow_jobs).is_running() || id(execute_energy_jobs).is_running()) {
            return;
          }
          
          id(fast_poll_timer) += 1;
          id(slow_poll_timer) += 1;
          id(energy_poll_timer) += 1;
          
          if (id(energy_poll_timer) >= (id(energy_poll_interval).state * 3600)) {
            id(energy_poll_timer) = 0;
            id(execute_energy_jobs).execute();
          } else if (id(slow_poll_timer) >= id(slow_poll_interval).state) {
            id(slow_poll_timer) = 0;
            id(execute_slow_jobs).execute();
          } else if (id(fast_poll_timer) >= id(fast_poll_interval).state) {
            id(fast_poll_timer) = 0;
            id(execute_fast_jobs).execute();
          }

